<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enerza - Dispositivos</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="scr">
        <header>
            <div class="logo"><img src="css/img/logoEnerza.png" alt="Logo Enerzā"></div>
            <h1 class="t">dispositivos conectados</h1>
        </header>
        <div class="grid w2c">
            <nav class="box"><a href="inicio.html"><img src="css/img/casa.png" alt="Início"></a>
                <a href="dispositivos.html" class=on><img src="css/img/lampada.png" alt="Dispositivos"></a>

                <a href="sala.html"><img src="css/img/temp.png" alt="Sala"></a>

                <div class="sp"></div>

                <a href="configuracao.html"><img src="css/img/config.png" alt="Configurações"></a>
                <a href="index2.html" id="sair" title="Sair"><img src="css/img/saida.png" alt="Sair"></a>
            </nav>

            <div class="dev-wrap">
                <div class="dev-bar">
                    <span class="dev-resumo" id="resumo">Carregando aparelhos...</span>
                    <a href="#" class="btn peq" id="abrirAdd" style="display:none">+ Adicionar aparelho</a>
                </div>

                <!-- formulário de novo aparelho (só admin) -->
                <div class="box fam-add dev-add" id="addBox">
                    <select id="descobertos" style="display:none"></select>
                    <input type="text" id="tuyaId" placeholder="Device ID da Tuya" autocomplete="off">
                    <input type="text" id="nome" placeholder="Nome (ex.: Ventilador)" maxlength="60">
                    <select id="comodo">
                        <option value="">Cômodo...</option>
                        <option value="sala">Sala</option>
                        <option value="cozinha">Cozinha</option>
                        <option value="quarto">Quarto</option>
                        <option value="banheiro">Banheiro</option>
                    </select>
                    <select id="icone">
                        <option>🔌</option><option>💡</option><option>📺</option><option>🎮</option>
                        <option>❄️</option><option>🌀</option><option>🍳</option><option>☕</option>
                        <option>🔥</option><option>💧</option><option>🖥️</option><option>🔊</option>
                    </select>
                    <input type="number" id="potencia" class="peq" placeholder="Watts" min="0" max="20000">
                    <a href="#" class="btn peq" id="salvarAdd">Salvar</a>
                    <a href="#" class="btn o peq" id="cancelarAdd">Cancelar</a>
                </div>
                <div class="fam-msg" id="msg"></div>

                <!-- painel de lâmpada (cor, brilho, branco) -->
                <div class="box luz-painel" id="luzBox">
                    <div class="luz-topo"><b id="luzNome">Lâmpada</b><a href="#" class="btn o peq" id="luzFechar">Fechar</a></div>
                    <div class="luz-lin" id="luzCorLin"><span class="luz-rot">Cor</span><input type="color" id="luzCor" value="#ffffff"><div class="luz-sw" id="luzSw"></div></div>
                    <div class="luz-lin" id="luzBrilhoLin"><span class="luz-rot">Brilho</span><input type="range" id="luzBrilho" min="1" max="100" value="100"><output id="luzBrilhoV">100%</output></div>
                    <div class="luz-lin" id="luzTempLin"><span class="luz-rot">Branco</span><small>quente</small><input type="range" id="luzTemp" min="0" max="100" value="50"><small>frio</small></div>
                    <small class="luz-aviso" id="luzAviso">Ligue a lâmpada para ajustar.</small>
                </div>

                <div class="dev" id="lista"></div>
            </div>
        </div>
    </div>

    <script src="script/dispositivos.js"></script>
</body>

</html>
