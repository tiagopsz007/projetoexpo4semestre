<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enerza - Sala</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="scr">
        <header>
            <div class="logo"><img src="css/img/logoEnerza.png" alt="Logo Enerzā"></div>
            <h1 class="t">Sala</h1>
            <div class="tabs"><a href="inicio.html">Inicio</a><a href="sala.html" class=on>Sala</a><a
                    href="cozinha.html">Cozinha</a><a href="quarto.html">Quarto</a><a href="banheiro.html">Banheiro</a>
            </div>
        </header>
        <div class="grid ">
            <nav class="box"><a href="inicio.html"><img src="css/img/casa.png" alt="Início"></a>
                <a href="dispositivos.html"><img src="css/img/lampada.png" alt="Dispositivos"></a>
                
                <a href="sala.html" class=on><img src="css/img/temp.png" alt="Sala"></a>

                <div class="sp"></div>
                
                <a href="configuracao.html"><img src="css/img/config.png" alt="Configurações"></a>
                <a href="index2.html" id="sair" title="Sair"><img src="css/img/saida.png" alt="Sair"></a>
            </nav>
            <div class="col">
                
                <div class="box energy">
                    <h3>Gastos<br>da sala</h3>
                    <div class="row">
                        <div class="ic">📺</div>
                        <div><b>Smart tv</b><small>1 dispositivo</small></div><span class="w">150 W</span>
                    </div>
                    <div class="row">
                        <div class="ic">🎮</div>
                        <div><b>PS5</b><small>1 dispositivo</small></div><span class="w">220W</span>
                    </div>
                    <div class="row">
                        <div class="ic">💡</div>
                        <div><b>Lâmpada</b><small>2 dispositivo</small></div><span class="w">8 W</span>
                    </div>
                    <div class="row">
                        <div class="ic">❄️</div>
                        <div><b>Ar-condicionado</b><small>1 dispositivo</small></div><span class="w">800 W</span>
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="box pad">
                    <h3>Ar-condicionado</h3>
                    <div class="chips">
                        <div class="chip">− <span class="big">22°</span> +</div>
                        <div class="chip">Ligado<br><label class="tg"><input type="checkbox"
                                    checked><span></span></label></div>
                        <div class="chip">Modo<br><b class="y">Frio</b></div>
                    </div>
                </div>
                <div class="box rooms">
                    <div class="view p-sala">
                        <div class="tag">Sala <label class="star"><input type="checkbox" checked>★</label></div>
                    </div>
                    <div class="view p-cam">
                        <div class="tag">Camera da sala</div><span class="live">● AO VIVO</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
