<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="scr">
        <header>
            <div class="logo"><img src="css/img/logoEnerza.png" alt="Logo Enerzā"></div>
            <h1 class="t">Usuário</h1>
        </header>
        <div class="grid w2c">
            <nav class="box"><a href="inicio.html"><img src="css/img/casa.png" alt="Início"></a>
                <a href="dispositivos.html"><img src="css/img/lampada.png" alt="Dispositivos"></a>
                
                <a href="sala.html"><img src="css/img/temp.png" alt="Sala"></a>

                <div class="sp"></div>
                
                <a href="configuracao.html" class=on><img src="css/img/config.png" alt="Configurações"></a>
                <a href="index2.html" id="sair" title="Sair"><img src="css/img/saida.png" alt="Sair"></a>
            </nav>
            <div>
                <div class="box prof">
                    <div class="av">👤</div>
                    <div class="fam-info">
                        <div class="fam-nome" id="nome">Carregando...</div>
                        <div class="fam-email" id="email"></div>
                        <div class="fam-fam" id="familia"></div>
                    </div>
                    <span class="badge" id="cargo"></span>
                    <a class="btn" href="#" id="abrirSenha">Redefinir senha</a>
                </div>

                <div class="box senha-box" id="senhaBox">
                    <h4>Redefinir senha</h4>
                    <label for="atual">Senha atual</label>
                    <input type="password" id="atual" autocomplete="current-password">
                    <label for="nova">Nova senha</label>
                    <input type="password" id="nova" autocomplete="new-password">
                    <label for="confirmar">Confirmar nova senha</label>
                    <input type="password" id="confirmar" autocomplete="new-password">
                    <div class="fam-msg" id="msg" role="alert"></div>
                    <div class="acoes">
                        <a class="btn" href="#" id="salvarSenha">Salvar</a>
                        <a class="btn o" href="#" id="cancelarSenha">Cancelar</a>
                    </div>
                </div>

                <div class="pref">
                    <div class="box">
                        <h4>Preferências</h4><select>
                            <option>Português (BR)</option>
                            <option>English</option>
                        </select><select>
                            <option>Tema escuro</option>
                            <option>Tema claro</option>
                        </select>
                    </div>
                    <div class="box">
    <h4 style="display: flex; justify-content: space-between; align-items: center;">
        <span>Dispositivos conectados</span>
        <a href="dispositivos.html"><img src="css/img/proximo.png" alt="Próximo"></a>
    </h4>
    <div class="chk"><label class="tg"><input type="checkbox" checked><span></span></label> Tv da sala</div>
    <div class="chk"><label class="tg"><input type="checkbox" checked><span></span></label> Roteador</div>
    <div class="chk"><label class="tg"><input type="checkbox"><span></span></label> Lâmpada da cozinha</div>
</div>
                </div>
            </div>
        </div>
