<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enerza - Cozinha</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="scr">
        <header>
            <div class="logo"><img src="css/img/logoEnerza.png" alt="Logo Enerzā"></div>
            <h1 class="t">Cozinha</h1>
            <div class="tabs"><a href="inicio.html">Inicio</a><a href="sala.html">Sala</a><a href="cozinha.html"
                    class=on>Cozinha</a><a href="quarto.html">Quarto</a><a href="banheiro.html">Banheiro</a></div>
        </header>
        <div class="grid ">
            <nav class="box"><a href="inicio.html" class=on><img src="css/img/casa.png" alt="Início"></a>
                <a href="dispositivos.html"><img src="css/img/lampada.png" alt="Dispositivos"></a>
                
                <a href="sala.html"><img src="css/img/temp.png" alt="Sala"></a>

                <div class="sp"></div>

                <a href="configuracao.html"><img src="css/img/config.png" alt="Configurações"></a>
                <a href="index2.html" id="sair" title="Sair"><img src="css/img/saida.png" alt="Sair"></a>
            </nav>
            <div class="col">
                <div class="box weather">
                    <div class="ico">⛅</div>
                    <div class="tt">25 c°</div>
                </div>
                <div class="box energy">
                    <h3>Gastos<br>da Cozinha</h3>
                    <div class="row">
                        <div class="ic">🍳</div>
                        <div><b>Forno</b><small>1 dispositivo</small></div><span class="w">2200 W</span>
                    </div>
                    <div class="row">
                        <div class="ic">🧊</div>
                        <div><b>Geladeira</b><small>1 dispositivo</small></div><span class="w">150 W</span>
                    </div>
                    <div class="row">
                        <div class="ic">💡</div>
                        <div><b>Lâmpada</b><small>2 dispositivo</small></div><span class="w">8 W</span>
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="box pad">
                    <h3>Timer da cozinha</h3>
                    <div class="chips">
                        <div class="big">00:00</div><a class="btn" href="#">Iniciar</a>
                    </div>
                </div>
                <div class="box pad">
                    <div class="tiles"><label class="tile p-cozinha"><input type="checkbox" checked>Forno</label><label
                            class="tile p-cozinha"><input type="checkbox">Fogão</label><label class="tile p-sala"><input
                                type="checkbox">Cafeteira</label><label class="tile p-banheiro"><input
                                type="checkbox">Geladeira</label></div>
                </div>
            </div>
        </div>
    </div>
