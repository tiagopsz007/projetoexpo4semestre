# ================== Enerzā - configuração ==================
# Este arquivo NÃO é enviado ao navegador (fica só no servidor Java).

porta=8080
abrir.navegador=true

# ---------- Spotify ----------
# 1. Acesse https://developer.spotify.com/dashboard e crie um app (marque "Web API")
# 2. Em "Redirect URIs" cadastre exatamente:  http://127.0.0.1:8080/spotify/callback
# 3. Copie o Client ID e o Client Secret para cá
# Obs.: play/pause/próxima só funcionam com conta Premium (limitação do Spotify).
spotify.client.id=8525c905c77640f4b4ae893b9020b556
spotify.client.secret=28913bc7ef714c6581a9732e390ce5d2

# ---------- Xiaomi Home oficial via Home Assistant (recomendado) ----------
# Usa a integração https://github.com/XiaoMi/ha_xiaomi_home instalada no Home Assistant.
# ha.url   -> endereço do Home Assistant (ex.: http://homeassistant.local:8123)
# ha.token -> Home Assistant > seu perfil > Segurança > "Tokens de acesso de longa duração" > Criar token
# Todos os aparelhos da sua conta Xiaomi aparecem sozinhos na página de início.
ha.url=
ha.token=
ha.integracao=xiaomi_home

# ---------- Xiaomi direto pela rede local (alternativa sem Home Assistant) ----------
# Liste os ids separados por vírgula e configure cada um abaixo.
# ip     -> IP do aparelho na sua rede (veja no roteador ou no app Mi Home > aparelho > Informações de rede)
# token  -> 32 caracteres hexadecimais (veja LEIA-ME.md para descobrir)
# protocolo:
#   miot   -> aparelhos mais novos (padrão). Liga/desliga é normalmente siid=2 piid=1
#   legado -> aparelhos antigos / Yeelight (usa set_power "on"/"off")
# Para descobrir siid/piid do seu modelo: https://home.miot-spec.com
xiaomi.dispositivos=
#xiaomi.dispositivos=luz,tomada

#xiaomi.luz.nome=Luz da sala
#xiaomi.luz.icone=💡
#xiaomi.luz.ip=192.168.0.50
#xiaomi.luz.token=00112233445566778899aabbccddeeff
#xiaomi.luz.protocolo=miot
#xiaomi.luz.siid=2
#xiaomi.luz.piid=1

#xiaomi.tomada.nome=Tomada do PS5
